---
- name: Deploy Java Application Docker Container
  hosts: appserver # This matches the group in your inventory file
  become: yes      # This tells Ansible to run commands with sudo

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install pip for Python 3
      apt:
        name: python3-pip
        state: present

    - name: Install Docker SDK for Python
      pip:
        name: docker
        state: present

    - name: Stop and remove any existing container of the same name
      docker_container:
        name: "java-app"
        state: absent

    - name: Remove current Docker image
      docker_image:
        name: "kasthourirangane/devops-java-image"
        tag: "latest"
        state: absent
        force: yes

    - name: Pull the latest Docker image from Docker Hub
      docker_image:
        name: "kasthourirangane/devops-java-image" # actual Docker image name
        tag: "latest"
        source: pull

    - name: Run the Docker container
      docker_container:
        name: "java-app"
        image: "kasthourirangane/devops-java-image:latest" # Use your actual Docker image name
        state: started
        restart_policy: always
        ports:
          - "8080:8080" # Map port 8080 on the host to port 8080 in the container

